<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffb703"/>
      <stop offset="1" stop-color="#219ebc"/>
    </linearGradient>
  </defs>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="#0f0f0f"/>
  <rect x="2" y="2" width="60" height="60" rx="16" fill="none" stroke="url(#g)" stroke-width="2" opacity="0.6"/>
  <!-- mesh edges -->
  <g stroke="url(#g)" stroke-width="2" opacity="0.85">
    <line x1="20" y1="18" x2="44" y2="24"/>
